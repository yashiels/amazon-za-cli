name: "CI: Checks"

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up actionlint
        run: scripts/install-actionlint.sh
      - name: Lint workflows
        run: actionlint
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true
      - name: Test
        run: TZ=UTC go test ./...
      - name: Lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9
        with:
          version: v2.15.0
      - name: Build
        run: make build
      - name: Test release tooling
        run: python3 scripts/release_test.py
